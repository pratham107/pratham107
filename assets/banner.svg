<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29">
        <animate attributeName="stop-color" values="#0f0c29;#302b63;#24243e;#0f0c29" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#6a11cb">
        <animate attributeName="stop-color" values="#6a11cb;#2575fc;#ff5f6d;#6a11cb" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <style>
      .title { font: 800 46px 'Segoe UI', Arial, sans-serif; fill: #fff; opacity: 0; animation: rise 1.2s ease-out .3s forwards; }
      .sub   { font: 400 22px 'Segoe UI', Arial, sans-serif; fill: #e0e7ff; opacity: 0; animation: rise 1.2s ease-out 1s forwards; }
      .tag   { font: 500 16px 'Courier New', monospace; fill: #c4b5fd; opacity: 0; animation: rise 1.2s ease-out 1.6s forwards; }
      .cursor{ animation: blink 1s steps(1) infinite; }
      @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <circle cx="120" cy="70" r="28" fill="#fff" opacity=".12"><animate attributeName="cy" values="70;190;70" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="780" cy="190" r="40" fill="#fff" opacity=".10"><animate attributeName="cy" values="190;50;190" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="450" cy="30" r="14" fill="#fff" opacity=".15"><animate attributeName="cx" values="450;650;250;450" dur="9s" repeatCount="indefinite"/></circle>
  <text x="450" y="115" text-anchor="middle" class="title">Hi, I'm Prathmesh Bhopale 👋</text>
  <text x="450" y="160" text-anchor="middle" class="sub">Software Engineer · Backend &amp; Full-Stack<tspan class="cursor">|</tspan></text>
  <text x="450" y="200" text-anchor="middle" class="tag">Node.js • NestJS • TypeScript • React • PostgreSQL</text>
</svg>
