name: LeetCode Streak

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/leetcode_streak.py
        env:
          LEETCODE_USER: Prathamesh28
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/leetcode-streak.svg
          git diff --staged --quiet || git commit -m "Update LeetCode streak"
          git push
